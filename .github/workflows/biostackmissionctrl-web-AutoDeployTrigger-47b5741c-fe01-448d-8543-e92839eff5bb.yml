name: Trigger auto deployment for biostackmissionctrl-web

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/biostackmissionctrl-web-AutoDeployTrigger-47b5741c-fe01-448d-8543-e92839eff5bb.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.BIOSTACKMISSIONCTRLWEB_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.BIOSTACKMISSIONCTRLWEB_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.BIOSTACKMISSIONCTRLWEB_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: biostackmissionctrlacr.azurecr.io
          registryUsername: ${{ secrets.BIOSTACKMISSIONCTRLWEB_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.BIOSTACKMISSIONCTRLWEB_REGISTRY_PASSWORD }}
          containerAppName: biostackmissionctrl-web
          resourceGroup: biostack-rg
          imageToBuild: biostackmissionctrlacr.azurecr.io/biostackmissionctrl-web:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


