name: secret-scan

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (checksum-pinned)
        env:
          GITLEAKS_VERSION: "8.24.3"
          GITLEAKS_LINUX_X64_SHA256: "9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c"
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/gitleaks-bin"
          timeout 2m curl \
            --fail \
            --silent \
            --show-error \
            --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${RUNNER_TEMP}/gitleaks.tar.gz"
          printf '%s  %s\n' \
            "${GITLEAKS_LINUX_X64_SHA256}" \
            "${RUNNER_TEMP}/gitleaks.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" \
            -C "${RUNNER_TEMP}/gitleaks-bin" \
            gitleaks
      - name: Run gitleaks
        run: |
          "${RUNNER_TEMP}/gitleaks-bin/gitleaks" dir \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            .
